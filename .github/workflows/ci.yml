name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s test -p "test_*.py"
      - run: powershell -NoProfile -File test/test_startup.ps1
      - run: powershell -NoProfile -File test/test_recovery.ps1
      - run: python -m pip install pyinstaller==6.16.0
      - run: python scripts/build_windows_helper.py
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.2.0
      - run: pio run -e cyd
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
