[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
lib_deps =
  bblanchon/ArduinoJson @ 6.21.5
  bodmer/TFT_eSPI @ 2.5.43
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT
  -DILI9341_DRIVER=1
  -DTFT_RGB_ORDER=TFT_RGB
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DTOUCH_CS=-1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
build_src_flags =
  -Wall
  -Wextra
